name: Build unsigned IPA and publish prerelease

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26-intel
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          IPA_ROOT="$RUNNER_TEMP/ipa-root"
          IPA_EXPORT="$RUNNER_TEMP/ipa-export"

          xcodebuild \
            -project Velura.xcodeproj \
            -scheme Velura \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Velura.app"
          test -d "$APP_PATH"
          python3 - "$APP_PATH" <<'PY'
          from pathlib import Path
          import plistlib
          import sys

          app_path = Path(sys.argv[1])
          extension_path = app_path / "PlugIns" / "VeluraLiveActivity.appex"
          with (app_path / "Info.plist").open("rb") as plist_file:
              app_info = plistlib.load(plist_file)
          with (extension_path / "Info.plist").open("rb") as plist_file:
              extension_info = plistlib.load(plist_file)

          for key in ("CFBundleShortVersionString", "CFBundleVersion"):
              if not app_info.get(key) or app_info[key] != extension_info.get(key):
                  raise SystemExit(f"App and Live Activity metadata differ for {key}")

          expected_orientations = {
              "UIInterfaceOrientationPortrait",
              "UIInterfaceOrientationLandscapeLeft",
              "UIInterfaceOrientationLandscapeRight",
          }
          if set(app_info.get("UISupportedInterfaceOrientations", [])) != expected_orientations:
              raise SystemExit("Built app has unexpected iPhone orientations")

          manifest_path = app_path / "PrivacyInfo.xcprivacy"
          with manifest_path.open("rb") as plist_file:
              privacy_manifest = plistlib.load(plist_file)
          expected_api = {
              "NSPrivacyAccessedAPIType": "NSPrivacyAccessedAPICategoryUserDefaults",
              "NSPrivacyAccessedAPITypeReasons": ["CA92.1"],
          }
          if privacy_manifest.get("NSPrivacyAccessedAPITypes") != [expected_api]:
              raise SystemExit("Built app privacy manifest is missing the audited UserDefaults reason")

          print(
              "Verified app and Live Activity metadata: "
              f"{app_info['CFBundleShortVersionString']} ({app_info['CFBundleVersion']})"
          )
          PY
          mkdir -p "$IPA_ROOT/Payload" "$IPA_EXPORT"
          cp -R "$APP_PATH" "$IPA_ROOT/Payload/Velura.app"
          ditto -c -k --sequesterRsrc --keepParent "$IPA_ROOT/Payload" "$IPA_EXPORT/Velura-unsigned.ipa"
          unzip -tq "$IPA_EXPORT/Velura-unsigned.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: velura-ios-unsigned-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/ipa-export/Velura-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_PATH="$RUNNER_TEMP/ipa-export/Velura-unsigned.ipa"
          TAG_NAME="velura-pre-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}"
          gh release create "$TAG_NAME" "$IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Velura pre-release ${GITHUB_RUN_NUMBER}" \
            --notes "Unsigned IPA built from commit ${GITHUB_SHA} on ${GITHUB_REF_NAME}. This IPA must be signed before installation. Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --prerelease
